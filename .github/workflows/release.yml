# Publishes the node image to GitHub Container Registry.
#
#   ghcr.io/<owner>/plainchain:<semver>   on a tag  vX.Y.Z (also :X.Y, :latest)
#   ghcr.io/<owner>/plainchain:main       on every push to main
#   ghcr.io/<owner>/plainchain:sha-<sha>  always
#
# The package inherits the repository's visibility. Pulling a private image
# from a cluster needs an imagePullSecret (see k8s/README.md).
name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a tag that does not match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "$expected" ] || { echo "tag ${GITHUB_REF_NAME} but package.json says $expected"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=plainchain
            org.opencontainers.image.description=Standalone Layer 1 blockchain node (PoW or PoA), built from Node's native crypto
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
