# Bearer token for the protected RPC methods (`mine`). Replace before use:
#   kubectl -n l1 create secret generic l1-node --from-literal=L1_RPC_TOKEN="$(openssl rand -hex 32)" --dry-run=client -o yaml
# or manage it with your secret store; this file only makes `apply -k` work
# out of the box.
apiVersion: v1
kind: Secret
metadata:
  name: l1-node
type: Opaque
stringData:
  L1_RPC_TOKEN: change-me-testnet-rpc-token
